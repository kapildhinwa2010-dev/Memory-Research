[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Memory-Research"
version = "1.0.0"
description = "Memory research tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Kapil Dhinwa"}]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/Memory-Research"

[tool.setuptools]
packages = ["memory_research"]
